services:
  app:
    build: .
    container_name: user-service-app
    ports:
      - "${DOCKER_HOST_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: ${SERVER_PORT:-8080}

      DOCKER_DB_URL: ${DOCKER_DB_URL}
      DOCKER_DB_USERNAME: ${DOCKER_DB_USERNAME}
      DOCKER_DB_PASSWORD: ${DOCKER_DB_PASSWORD}

      DOCKER_REDIS_HOST: ${DOCKER_REDIS_HOST}
      DOCKER_REDIS_PORT: ${DOCKER_REDIS_PORT}

      DOCKER_JWT_SECRET: ${DOCKER_JWT_SECRET}
      DOCKER_INTERNAL_SERVICE_SECRET: ${DOCKER_INTERNAL_SERVICE_SECRET}

      ADMIN_USER_ID: ${ADMIN_USER_ID}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_SURNAME: ${ADMIN_SURNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: user-service-postgres
    environment:
      POSTGRES_DB: ${DOCKER_DB_NAME}
      POSTGRES_USER: ${DOCKER_DB_USERNAME}
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: user-service-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: