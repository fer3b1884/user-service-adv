name: Setup Java and Maven
description: Configure Java 25 and prepare Maven Wrapper
runs:
  using: composite
  steps:
    - name: Set up Java 25
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
        cache: maven
    - name: Prepare Maven Wrapper
      shell: bash
      run: chmod +x mvnw