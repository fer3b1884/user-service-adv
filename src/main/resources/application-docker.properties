spring.datasource.url=${DOCKER_DB_URL:jdbc:postgresql://postgres:5432/user-service-adv}
spring.datasource.username=${DOCKER_DB_USERNAME:postgres}
spring.datasource.password=${DOCKER_DB_PASSWORD}

spring.data.redis.host=${DOCKER_REDIS_HOST:redis}
spring.data.redis.port=${DOCKER_REDIS_PORT:6379}

security.jwt.secret=${DOCKER_JWT_SECRET}

app.internal.secret=${DOCKER_INTERNAL_SERVICE_SECRET}